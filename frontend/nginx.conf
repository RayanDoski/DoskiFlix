server {
    listen 80;
    server_name localhost; # Ändra detta till doskiflix-frontend.fly.dev eller ditt domännamn

    location / {
        root /usr/share/nginx/html; # Sökvägen till din byggda frontend (där index.html ligger)
        index index.html;
        try_files $uri $uri/ /index.html; # <<< Ändrad rad: skickar allt till index.html
    }

    # Fortsätt att ha ditt /api/ block här om det inte redan är på plats
    # location /api/ {
    #    proxy_pass http://127.0.0.1:5000;
    #    ...
    # }
}